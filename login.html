<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Aula Virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="navbar"></nav>

<main class="contenedor">
    <form id="form-login" class="form-tarjeta">
        <h2>Iniciar sesión</h2>
        <div id="mensaje-login" class="estado-info estado-error oculto" style="margin-top:0.75rem;"></div>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">

        <button type="submit" class="btn btn-primario">Iniciar sesión</button>

        <p><a href="recuperar-password.html">¿Olvidaste tu contraseña?</a></p>
        <p>¿No tenés cuenta? <a href="registro.html">Registrate</a></p>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
