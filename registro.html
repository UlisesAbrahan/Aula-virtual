<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta · Aula Virtual</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="navbar"></nav>

<main class="contenedor">
    <form id="form-registro" class="form-tarjeta">
        <h2>Crear cuenta</h2>
        <p style="text-align:left; color:var(--color-texto-muted); font-size:0.85rem;">
            Tu cuenta quedará pendiente de aprobación por un administrador antes de poder acceder al contenido.
        </p>

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="apellido" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">

        <label for="confirmacion">Confirmar contraseña</label>
        <input type="password" id="confirmacion" name="confirmacion" required minlength="8" autocomplete="new-password">

        <button type="submit" class="btn btn-primario">Crear cuenta</button>
        <p>¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a></p>
    </form>

    <div id="registro-exito" class="form-tarjeta estado-info estado-exito oculto">
        <h2>¡Cuenta creada!</h2>
        <p>Revisá tu correo para confirmar la cuenta. Un administrador debe activarla antes de que puedas ingresar.</p>
        <a href="login.html" class="btn btn-primario">Ir a iniciar sesión</a>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
