<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña · Aula Virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="navbar"></nav>

<main class="contenedor">
    <form id="form-recuperar" class="form-tarjeta">
        <h2>Recuperar contraseña</h2>
        <p style="text-align:left; color:var(--color-texto-muted); font-size:0.85rem;">
            Ingresá tu email y te enviaremos un enlace para restablecer tu contraseña.
        </p>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">

        <button type="submit" class="btn btn-primario">Enviar enlace de recuperación</button>
        <p><a href="login.html">Volver a iniciar sesión</a></p>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
