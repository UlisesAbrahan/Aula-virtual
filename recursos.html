<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recursos · Aula Virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav id="navbar"></nav>

<main class="contenedor">
    <div class="franja-seccion">
        <h1>Biblioteca de recursos</h1>
        <button id="btn-nuevo-recurso" class="btn btn-primario oculto">+ Subir recurso</button>
    </div>

    <div id="panel-nuevo-recurso" class="panel-formulario oculto">
        <h2>Subir recurso</h2>
        <form id="form-nuevo-recurso">
            <label for="nr-titulo">Título</label>
            <input type="text" id="nr-titulo" name="titulo" required>

            <label for="nr-descripcion">Descripción</label>
            <textarea id="nr-descripcion" name="descripcion"></textarea>

            <label for="nr-archivo">Archivo</label>
            <input type="file" id="nr-archivo" name="archivo" required
                   accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip,.png,.jpg,.jpeg">
            <p class="texto-muted">Formatos permitidos: PDF, DOC(X), XLS(X), PPT(X), TXT, ZIP, PNG, JPG. Máximo 25 MB.</p>

            <div style="display:flex; gap:1rem; flex-wrap:wrap;">
                <div style="flex:1; min-width:160px;">
                    <label for="nuevo-rec-categoria">Categoría</label>
                    <select id="nuevo-rec-categoria" name="categoria_id" required></select>
                </div>
                <div style="flex:1; min-width:160px;">
                    <label for="nuevo-rec-curso">Curso</label>
                    <select id="nuevo-rec-curso" name="curso_id"></select>
                </div>
                <div style="flex:1; min-width:120px;">
                    <label for="nr-cuatrimestre">Cuatrimestre</label>
                    <select id="nr-cuatrimestre" name="cuatrimestre">
                        <option value="">-</option>
                        <option value="1">1° Cuatrimestre</option>
                        <option value="2">2° Cuatrimestre</option>
                    </select>
                </div>
            </div>

            <label for="nr-unidad">Unidad / Tema</label>
            <input type="text" id="nr-unidad" name="unidad" placeholder="Ej: Bases de Datos">

            <label for="nr-etiquetas">Etiquetas (separadas por coma)</label>
            <input type="text" id="nr-etiquetas" name="etiquetas" placeholder="Ej: basesdedatos, der">

            <button type="submit" class="btn btn-primario">Subir recurso</button>
        </form>
    </div>

    <div class="barra-filtros">
        <input type="text" id="filtro-buscar-recurso" placeholder="Buscar por título o descripción...">
        <select id="filtro-categoria-recurso"></select>
        <select id="filtro-curso-recurso"></select>
        <select id="filtro-tipo-recurso">
            <option value="">Todos los tipos</option>
            <option value="pdf">PDF</option>
            <option value="doc">DOC</option>
            <option value="docx">DOCX</option>
            <option value="xls">XLS</option>
            <option value="xlsx">XLSX</option>
            <option value="ppt">PPT</option>
            <option value="pptx">PPTX</option>
            <option value="txt">TXT</option>
            <option value="zip">ZIP</option>
            <option value="png">PNG</option>
            <option value="jpg">JPG</option>
            <option value="jpeg">JPEG</option>
        </select>
    </div>

    <div id="lista-recursos" class="grid-tarjetas"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
<script src="js/recursos.js"></script>
</body>
</html>
